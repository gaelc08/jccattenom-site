{{ define "main" }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>
/* ── PAGE ── */
.cal-page { padding:110px 0 60px; }
.cal-title { text-align:center; margin-bottom:28px; }
.cal-title h1 { font-family:var(--font-head); font-size:2rem; font-weight:800; color:var(--text); margin-bottom:6px; }
.cal-title h1 span { color:var(--accent); }
.cal-title p { color:var(--text-muted); font-size:.9rem; }

/* ── PILLS ── */
.cat-bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:24px; }
.cat-pill {
  display:flex; align-items:center; gap:7px;
  padding:7px 16px; border-radius:999px;
  font-size:.82rem; font-weight:600; font-family:var(--font-body);
  cursor:pointer; border:2px solid transparent;
  background:var(--bg-surface); color:var(--text-muted);
  transition:all .18s;
}
.cat-pill .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.cat-pill:hover { color:var(--text); border-color:var(--border-strong); }
.cat-pill.active { color:#fff !important; }

/* ── CALENDAR WRAP ── */
.cal-wrap { background:var(--bg-surface); border-radius:16px; border:1px solid var(--border); padding:20px 20px 8px; overflow:hidden; }

/* ── FC RESET ── */
.fc { font-family:var(--font-body) !important; }
.fc .fc-toolbar { margin-bottom:16px !important; }
.fc .fc-toolbar-title { font-family:var(--font-head) !important; font-size:1.1rem !important; font-weight:700; color:var(--text) !important; text-transform:capitalize; }
.fc .fc-button { background:var(--bg-elevated) !important; border:1px solid var(--border-strong) !important; color:var(--text-muted) !important; font-family:var(--font-body) !important; font-size:.8rem !important; padding:5px 13px !important; border-radius:8px !important; box-shadow:none !important; transition:all .15s !important; }
.fc .fc-button:hover { color:var(--text) !important; border-color:var(--accent) !important; }
.fc .fc-button-active, .fc .fc-button-primary:not(:disabled).fc-button-active { background:var(--accent) !important; color:var(--bg) !important; border-color:var(--accent) !important; font-weight:700 !important; }
.fc .fc-col-header-cell { background:transparent !important; border-color:var(--border) !important; padding:8px 0 !important; }
.fc .fc-col-header-cell-cushion { color:var(--text-muted) !important; font-size:.75rem !important; font-weight:600 !important; text-transform:uppercase; letter-spacing:.05em; text-decoration:none !important; }
.fc .fc-col-header-cell.fc-day-today .fc-col-header-cell-cushion { color:var(--accent) !important; }
.fc .fc-timegrid-slot { height:28px !important; border-color:rgba(255,255,255,.04) !important; }
.fc .fc-timegrid-slot-minor { border-color:transparent !important; }
.fc .fc-timegrid-axis,.fc .fc-timegrid-col { border-color:var(--border) !important; }
.fc .fc-day-today { background:rgba(226,177,60,.05) !important; }
.fc .fc-timegrid-slot-label-cushion { color:var(--text-dim) !important; font-size:.7rem !important; }
.fc .fc-timegrid-event { border:none !important; border-radius:7px !important; box-shadow:0 2px 8px rgba(0,0,0,.3) !important; }
.fc .fc-timegrid-event .fc-event-title { font-size:.75rem !important; font-weight:600 !important; white-space:normal; }
.fc .fc-timegrid-event .fc-event-time { font-size:.67rem !important; opacity:.8; }
.fc .fc-event-main { padding:3px 6px !important; }
.fc .fc-timegrid-now-indicator-line { border-color:var(--accent) !important; }
.fc .fc-daygrid-day { background:transparent !important; }
.fc .fc-daygrid-day-number { color:var(--text-muted) !important; font-size:.82rem !important; text-decoration:none !important; }
.fc .fc-day-today .fc-daygrid-day-number { color:var(--accent) !important; font-weight:700 !important; }
.fc .fc-daygrid-event { border:none !important; border-radius:4px !important; font-size:.72rem !important; font-weight:600 !important; }
.fc .fc-more-link { color:var(--accent) !important; font-size:.72rem !important; }
.fc .fc-popover { background:var(--bg-elevated) !important; border:1px solid var(--border-strong) !important; border-radius:10px !important; }
.fc .fc-popover-header { background:var(--bg-card) !important; color:var(--text) !important; }

/* ── MOBILE LIST CUSTOM ── */
#mob-list { display:none; }
#mob-list .ml-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
#mob-list .ml-nav button { background:var(--bg-elevated); border:1px solid var(--border-strong); color:var(--text-muted); border-radius:8px; padding:6px 14px; font-size:.8rem; font-family:var(--font-body); cursor:pointer; }
#mob-list .ml-nav button:hover { border-color:var(--accent); color:var(--text); }
#mob-list .ml-range { font-family:var(--font-head); font-size:.95rem; font-weight:700; color:var(--text); text-align:center; }
#mob-list .ml-day { margin-bottom:20px; }
#mob-list .ml-dayhead { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
#mob-list .ml-dayhead.today { color:var(--accent); }
#mob-list .ml-card {
  display:flex; align-items:stretch; gap:0;
  background:var(--bg-elevated); border-radius:10px;
  overflow:hidden; margin-bottom:8px; cursor:pointer;
  transition:transform .12s, box-shadow .12s;
}
#mob-list .ml-card:hover { transform:translateX(2px); box-shadow:0 4px 16px rgba(0,0,0,.25); }
#mob-list .ml-bar { width:4px; flex-shrink:0; }
#mob-list .ml-body { padding:11px 14px; flex:1; min-width:0; }
#mob-list .ml-name { font-weight:600; color:var(--text); font-size:.88rem; line-height:1.3; }
#mob-list .ml-time { font-size:.76rem; color:var(--text-muted); margin-top:3px; }
#mob-list .ml-empty { text-align:center; color:var(--text-dim); font-size:.88rem; padding:32px 0; }

/* ── POPUP ── */
.fcp-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9998; }
.fcp-card { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9999; background:var(--bg-elevated); border-radius:16px; padding:0; min-width:280px; max-width:360px; width:92%; box-shadow:0 24px 64px rgba(0,0,0,.6); overflow:hidden; }
.fcp-head { padding:20px 20px 16px; position:relative; }
.fcp-bar { height:3px; position:absolute; top:0; left:0; right:0; }
.fcp-close { position:absolute; top:12px; right:14px; background:none; border:none; color:var(--text-muted); font-size:1rem; cursor:pointer; line-height:1; padding:4px; }
.fcp-close:hover { color:var(--text); }
.fcp-title { font-family:var(--font-head); font-size:1.05rem; font-weight:700; color:var(--text); margin-top:8px; margin-bottom:14px; padding-right:24px; line-height:1.35; }
.fcp-row { display:flex; align-items:center; gap:9px; font-size:.83rem; color:var(--text-muted); margin-bottom:8px; }
.fcp-row svg { opacity:.45; flex-shrink:0; }
/* admin actions */
.fcp-actions { display:none; padding:14px 20px 18px; border-top:1px solid var(--border); gap:10px; }
.fcp-actions.show { display:flex; }
.fcp-btn { flex:1; padding:9px 0; border:none; border-radius:8px; font-size:.83rem; font-weight:600; font-family:var(--font-body); cursor:pointer; transition:opacity .2s; }
.fcp-btn:hover { opacity:.85; }
.fcp-btn-edit { background:var(--bg-card); color:var(--text); border:1px solid var(--border-strong); }
.fcp-btn-del { background:#dc2626; color:#fff; }

/* ── ADMIN LOGIN ── */
#admin-login { margin-top:28px; }
.adm-login-wrap { background:var(--bg-surface); border:1px solid var(--border); border-radius:12px; padding:20px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.adm-login-wrap label { font-size:.8rem; color:var(--text-muted); flex-shrink:0; }
.adm-login-wrap input { background:var(--bg-elevated); color:var(--text); border:1px solid var(--border-strong); border-radius:8px; padding:8px 12px; font-size:.85rem; font-family:var(--font-body); flex:1; min-width:120px; }
.adm-login-wrap button { background:var(--accent); color:var(--bg); border:none; border-radius:8px; padding:8px 16px; font-size:.85rem; font-weight:600; font-family:var(--font-body); cursor:pointer; }
#admin-login .adm-loggedin { display:none; align-items:center; gap:12px; background:var(--bg-surface); border:1px solid var(--border); border-radius:12px; padding:14px 20px; font-size:.85rem; color:var(--text-muted); }
#admin-login .adm-loggedin span { color:var(--accent); font-weight:600; }
#admin-login .adm-loggedin button { background:none; border:1px solid var(--border-strong); color:var(--text-dim); border-radius:6px; padding:5px 12px; font-size:.78rem; cursor:pointer; font-family:var(--font-body); }
.adm-err { font-size:.78rem; color:#dc2626; margin-top:6px; display:none; }

/* ── ADMIN FORM ── */
#admin-form { display:none; margin-top:16px; background:var(--bg-surface); border:1px solid var(--border); border-radius:14px; padding:24px; }
#admin-form h3 { font-family:var(--font-head); font-size:1rem; color:var(--text); margin-bottom:16px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.form-row.full { grid-template-columns:1fr; }
.form-group { display:flex; flex-direction:column; gap:5px; }
.form-group label { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); }
.form-group input, .form-group select, .form-group textarea { background:var(--bg-elevated); color:var(--text); border:1px solid var(--border-strong); border-radius:8px; padding:9px 12px; font-size:.88rem; font-family:var(--font-body); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--accent); }
.form-group textarea { resize:vertical; min-height:60px; }
.form-actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.btn { padding:9px 18px; border-radius:8px; font-size:.85rem; font-weight:600; font-family:var(--font-body); cursor:pointer; border:none; transition:opacity .2s; }
.btn:hover { opacity:.88; }
.btn-primary { background:var(--accent); color:var(--bg); }
.btn-secondary { background:var(--bg-elevated); color:var(--text); border:1px solid var(--border-strong); }
.btn-danger { background:#dc2626; color:#fff; }

/* ── RESPONSIVE ── */
@media(max-width:640px) {
  .cal-page { padding:88px 0 40px; }
  .cal-wrap { padding:12px 8px 6px; border-radius:12px; }
  .form-row { grid-template-columns:1fr; }
  #fc-desktop { display:none; }
  #mob-list { display:block; }
}
@media(min-width:641px) {
  #mob-list { display:none !important; }
}
</style>

<div class="cal-page container">
  <div class="cal-title">
    <h1>Calendrier <span>du Club</span></h1>
    <p>Cours du Judo Club Cattenom · Rodemack</p>
  </div>

  <div class="cat-bar" id="cat-bar">
    <button class="cat-pill active" data-cat="all" data-color="#e2b13c"><span class="dot" style="background:#e2b13c"></span>Toutes</button>
    <button class="cat-pill" data-cat="baby" data-color="#ef4444"><span class="dot" style="background:#ef4444"></span>Baby Judo</button>
    <button class="cat-pill" data-cat="enfants" data-color="#f59e0b"><span class="dot" style="background:#f59e0b"></span>Enfants</button>
    <button class="cat-pill" data-cat="ados" data-color="#8b5cf6"><span class="dot" style="background:#8b5cf6"></span>Ados</button>
    <button class="cat-pill" data-cat="adultes" data-color="#3b82f6"><span class="dot" style="background:#3b82f6"></span>Adultes</button>
    <button class="cat-pill" data-cat="taiso" data-color="#10b981"><span class="dot" style="background:#10b981"></span>Taïso</button>
  </div>

  <!-- DESKTOP FC -->
  <div class="cal-wrap" id="fc-desktop">
    <div id="calendar"></div>

  <!-- MOBILE CUSTOM LIST -->
  <div class="cal-wrap" id="mob-list">
    <div class="ml-nav">
      <button id="ml-prev">← Préc.</button>
      <div class="ml-range" id="ml-range"></div>
      <button id="ml-next">Suiv. →</button>

  </div>

  <!-- ADMIN LOGIN -->
  <div id="admin-login">
    <div class="adm-login-wrap" id="adm-login-form">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="opacity:.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <span style="font-size:.82rem;color:var(--text-dim);">Administration du calendrier</span>
      <button onclick="adminLogin()">Se connecter avec Keycloak</button>
    </div>
    <div class="adm-loggedin" id="adm-logged">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>Mode administration activé</span>
      <button onclick="adminLogout()">Déconnexion</button>

    <div id="admin-form">

          <select id="event-category">
            <option value="tous">Tous</option>
            <option value="baby">Baby Judo</option>

        <button class="btn btn-secondary" onclick="resetForm()">Annuler</button>

</div>

<script>
(function(){
var DATA = '/calendar/events.json';
var HIDDEN = ['iaido'];
var KC_URL = '{{ if hasPrefix .Site.BaseURL "https://test." }}https://auth.test.judo-cattenom.fr{{ else }}https://auth.judo-cattenom.fr{{ end }}';
var KC_REALM = 'jccattenom';
var KC_CLIENT = 'jcc-frontend';
var KC_ROLE = 'calendrier-admin';
var REDIRECT_URI = '{{ if hasPrefix .Site.BaseURL "https://test." }}https://test.judo-cattenom.fr/calendrier/{{ else }}https://judo-cattenom.fr/calendrier/{{ end }}';

var CAT_COLOR = {
  baby:'#ef4444', enfants:'#f59e0b', ados:'#8b5cf6',
  adultes:'#3b82f6', taiso:'#10b981', tous:'#e2b13c'
};

var staticEvents=[], localEvents=[], deletedEvents=[];
var currentCat='all';
var adminMode=false;
var calendar=null;
var mobWeekStart=null; /* lundi de la semaine courante */

/* ── STORAGE ── */
function save(){ localStorage.setItem('jcc_del',JSON.stringify(deletedEvents)); localStorage.setItem('jcc_loc',JSON.stringify(localEvents)); }
function load(){ var d=localStorage.getItem('jcc_del'); deletedEvents=d?JSON.parse(d):[]; var l=localStorage.getItem('jcc_loc'); localEvents=l?JSON.parse(l):[]; }

/* ── EVENTS ── */
/* Un deleted id peut être soit un ID complet (event one-shot) soit un slug de cours récurrent.
   On extrait le slug en enlevant le suffixe de date YYYYMMDD. */
function slugOf(id){ return id.replace(/-\d{8}$/,''); }
function getAll(){
  var all=staticEvents.filter(function(e){
    // supprimé si l'ID exact est dans deletedEvents OU si le slug y est
    return deletedEvents.indexOf(e.id)<0 && deletedEvents.indexOf(slugOf(e.id))<0;
  });
  localEvents.forEach(function(e){all.push(e);});
  return all.filter(function(e){return HIDDEN.indexOf(e.category)<0;});
}
function getFiltered(){
  var all=getAll();
  if(currentCat==='all') return all;
  return all.filter(function(e){return e.category===currentCat;});
}

/* ── PILLS ── */
document.getElementById('cat-bar').addEventListener('click',function(ev){
  var pill=ev.target.closest('.cat-pill'); if(!pill) return;
  currentCat=pill.dataset.cat;
  document.querySelectorAll('.cat-pill').forEach(function(p){
    p.classList.remove('active');
    p.style.background='var(--bg-surface)';
    p.style.color='var(--text-muted)';
  });
  pill.classList.add('active');
  pill.style.background=pill.dataset.color;
  pill.style.color='#fff';
  if(calendar) calendar.refetchEvents();
  renderMobList();
});
/* init first pill */
(function(){
  var p=document.querySelector('.cat-pill[data-cat="all"]');
  if(p){p.style.background=p.dataset.color;p.style.color='#fff';}
})();

/* ── DATE LOCALE (évite le décalage UTC/Paris) ── */
function ldate(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

/* ── FC (desktop) ── */
function toFC(e){
  var bg=e.color||CAT_COLOR[e.category]||'#e2b13c';
  return{id:e.id,title:e.title,start:e.start,end:e.end,allDay:e.allDay||false,
    backgroundColor:bg,borderColor:bg,textColor:'#fff',
    extendedProps:{description:e.description||'',category:e.category||'tous',location:e.location||'',event_type:e.event_type||'other',_local:!!e._local}};
}
function initCalendar(){
  var el=document.getElementById('calendar');
  calendar=new FullCalendar.Calendar(el,{
    initialView:'timeGridWeek',
    locale:'fr',timeZone:'Europe/Paris',firstDay:1,
    slotMinTime:'09:00:00',slotMaxTime:'22:30:00',slotDuration:'00:30:00',
    expandRows:true,nowIndicator:true,height:640,
    headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,listWeek'},
    buttonText:{today:'Auj.',month:'Mois',week:'Semaine',list:'Liste'},
    events:function(info,ok){
      /* info.startStr/endStr = ISO dans le timezone FC, fiable sans objet Date */
      var s=info.startStr.slice(0,10);
      var en=info.endStr.slice(0,10);
      ok(getFiltered().filter(function(e){return e.start.slice(0,10)>=s&&e.start.slice(0,10)<=en;}).map(toFC));
    },
    eventClick:function(info){showPopup(info.event);},
    eventTimeFormat:{hour:'2-digit',minute:'2-digit',hour12:false},
    slotLabelFormat:{hour:'2-digit',minute:'2-digit',hour12:false},
    allDayText:'Jour',noEventsText:'Aucun cours',weekText:'Sem.',
    moreLinkText:function(n){return'+'+n;},
    listDayFormat:{weekday:'long',day:'numeric',month:'long'},listDaySideFormat:false,
  });
  calendar.render();
}

/* ── MOBILE LIST ── */
function getMonday(d){
  var dt=new Date(d); var day=dt.getDay();
  /* dimanche(0)→reculer de 6, lundi(1)→0, ..., samedi(6)→reculer de 5 */
  var diff = day===0 ? 1 : 1-day;  /* dimanche: avancer au lundi suivant */
  dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt;
}
function fmt(date){return date.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function renderMobList(){
  if(!mobWeekStart) mobWeekStart=getMonday(new Date());
  var start=new Date(mobWeekStart);
  var end=new Date(mobWeekStart); end.setDate(end.getDate()+6); end.setHours(23,59,59);

  /* range label */
  var dlabel=start.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
  var elabel=end.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('ml-range').textContent=dlabel+' – '+elabel;

  /* filter events this week */
  var wStart=ldate(start); var wEnd=ldate(end);
  var events=getFiltered().filter(function(e){
    var k=e.start.slice(0,10);
    return k>=wStart && k<=wEnd;
  }).sort(function(a,b){return a.start.localeCompare(b.start);});

  /* group by day */
  var days={};
  for(var i=0;i<7;i++){
    var d=new Date(mobWeekStart); d.setDate(d.getDate()+i);
    days[ldate(d)]={date:d,events:[]};
  }
  events.forEach(function(e){
    var k=e.start.slice(0,10);
    if(days[k]) days[k].events.push(e);
  });

  var today=ldate(new Date());
  var html='';
  var hasAny=false;
  Object.keys(days).sort().forEach(function(k){
    var grp=days[k];
    if(grp.events.length===0) return;
    hasAny=true;
    var label=grp.date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    var isToday=k===today;
    html+='<div class="ml-day">';
    html+='<div class="ml-dayhead'+(isToday?' today':'')+'">'+label+'</div>';
    grp.events.forEach(function(e){
      var bg=e.color||CAT_COLOR[e.category]||'#e2b13c';
      var tStart=e.start?fmt(new Date(e.start)):'';
      var tEnd=e.end?fmt(new Date(e.end)):'';
      var time=tStart+(tEnd?' – '+tEnd:'');
      html+='<div class="ml-card" onclick="window._mlClick(\''+esc(e.id)+'\')">'+
        '<div class="ml-bar" style="background:'+bg+'"></div>'+
        '<div class="ml-body">'+
          '<div class="ml-name">'+esc(e.title)+'</div>'+
          '<div class="ml-time">'+time+'</div>'+
        '</div>'+
      '</div>';
    });
    html+='</div>';
  });
  if(!hasAny) html='<div class="ml-empty">Aucun cours cette semaine</div>';
  document.getElementById('ml-content').innerHTML=html;
}

window._mlClick=function(id){
  var ev=getAll().find(function(e){return e.id===id;});
  if(!ev) return;
  var bg=ev.color||CAT_COLOR[ev.category]||'#e2b13c';
  var tStart=ev.start?fmt(new Date(ev.start)):'';
  var tEnd=ev.end?fmt(new Date(ev.end)):'';
  showPopupRaw(id,ev.title,bg,new Date(ev.start),ev.end?new Date(ev.end):null,ev.location||'',ev._local||false);
};

        '<button class="fcp-close" onclick="document.getElementById(\'fcp\').remove()">✕</button>'+
        '<div class="fcp-title">'+esc(title)+'</div>'+
        (dStr?'<div class="fcp-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+dStr+'</div>':'')+
        (tStr?'<div class="fcp-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+tStr+'</div>':'')+
        (location?'<div class="fcp-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>'+esc(location)+'</div>':'')+
      '</div>'+

window._fcpEdit=function(id){
  document.getElementById('fcp').remove();
  var fcEv=calendar?calendar.getEventById(id):null;
  var raw=getAll().find(function(e){return e.id===id;});
  if(fcEv) openEdit(fcEv);
  else if(raw) openEditRaw(raw);
};
window._fcpDel=function(id){
  if(!confirm('Supprimer cet événement ?')) return;
  document.getElementById('fcp').remove();
  /* Pour un cours récurrent (ID = slug-YYYYMMDD), stocker le slug pour supprimer toutes les occurrences */
  var raw=getAll().find(function(e){return e.id===id;});
  var toDelete = (raw && !raw._local) ? slugOf(id) : id;
  deletedEvents.push(toDelete);
  localEvents=localEvents.filter(function(e){return e.id!==id;});
  save();
  if(calendar) calendar.refetchEvents();
  renderMobList();
};

/* ── ADMIN AUTH OIDC PKCE ── */
window.adminLogin=function(){
  /* génère code_verifier + code_challenge PKCE (helpers partagés: pkce-utils.js) */
  var verifier = JCC_PKCE.b64url(crypto.getRandomValues(new Uint8Array(32)));
  sessionStorage.setItem('pkce_v', verifier);
  sessionStorage.setItem('pkce_state', JCC_PKCE.b64url(crypto.getRandomValues(new Uint8Array(16))));
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(function(buf){
    var challenge = JCC_PKCE.b64url(new Uint8Array(buf));
    var params = new URLSearchParams({
      client_id: KC_CLIENT,
      redirect_uri: REDIRECT_URI,
      response_type: 'code',
      scope: 'openid profile email',
      state: sessionStorage.getItem('pkce_state'),
      code_challenge: challenge,
      code_challenge_method: 'S256'
    });
    window.location.href = KC_URL+'/realms/'+KC_REALM+'/protocol/openid-connect/auth?'+params;
  });
};
window.adminLogout=function(){
  adminMode=false;
  sessionStorage.removeItem('jcc_adm');
  sessionStorage.removeItem('jcc_tok');
  document.getElementById('adm-login-form').style.display='flex';
  document.getElementById('adm-logged').style.display='none';
  document.getElementById('admin-form').style.display='none';
  /* logout KC */
  window.location.href=KC_URL+'/realms/'+KC_REALM+'/protocol/openid-connect/logout?post_logout_redirect_uri='+encodeURIComponent(REDIRECT_URI)+'&client_id='+KC_CLIENT;
};
function checkAdminSession(){
  /* retour PKCE : code dans URL */
  var params=new URLSearchParams(window.location.search);
  var code=params.get('code'), state=params.get('state');
  if(code && state && state===sessionStorage.getItem('pkce_state')){
    /* échanger le code contre un token */
    var verifier=sessionStorage.getItem('pkce_v');
    sessionStorage.removeItem('pkce_v'); sessionStorage.removeItem('pkce_state');
    var body=new URLSearchParams({
      grant_type:'authorization_code', client_id:KC_CLIENT,
      redirect_uri:REDIRECT_URI, code:code, code_verifier:verifier
    });
    fetch(KC_URL+'/realms/'+KC_REALM+'/protocol/openid-connect/token',{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body.toString()
    }).then(function(r){return r.json();}).then(function(tok){
      if(tok.access_token){
        /* décoder le token et vérifier le rôle */
        var payload=JCC_PKCE.parseJWT(tok.access_token);
        var roles=(payload.realm_access&&payload.realm_access.roles)||[];
        if(roles.indexOf(KC_ROLE)>=0){
          sessionStorage.setItem('jcc_adm','1');
          sessionStorage.setItem('jcc_tok', tok.access_token);
          activateAdmin();
        } else {
          alert('Accès refusé : le rôle '+KC_ROLE+' est requis.');
        }
        /* nettoyer l'URL */
        history.replaceState({},'',REDIRECT_URI);
      }
    }).catch(function(e){console.error('OIDC error',e);});
    return;
  }
  /* session persistante */
  if(sessionStorage.getItem('jcc_adm')==='1'){
    /* vérifier que le token est encore valide */
    var tok=sessionStorage.getItem('jcc_tok');
    if(tok){
      var pl=JCC_PKCE.parseJWT(tok);
      if(pl && pl.exp*1000>Date.now()) { activateAdmin(); return; }
    }
    sessionStorage.removeItem('jcc_adm'); sessionStorage.removeItem('jcc_tok');
  }
}
function activateAdmin(){
  adminMode=true;
  document.getElementById('adm-login-form').style.display='none';
  document.getElementById('adm-logged').style.display='flex';
  document.getElementById('admin-form').style.display='block';
}

window.saveEvent=function(){
  var id=document.getElementById('event-id').value||('ev-'+Date.now());
  var ev={id:id,title:document.getElementById('event-title').value,
    event_type:document.getElementById('event-type').value,
    start:document.getElementById('event-start').value,
    end:document.getElementById('event-end').value||null,
    category:document.getElementById('event-category').value,
    color:document.getElementById('event-color').value,
    location:document.getElementById('event-location').value,
    description:document.getElementById('event-description').value,
    allDay:false,_local:true};
  if(!ev.title||!ev.start){alert('Titre et date requis');return;}
  var idx=localEvents.findIndex(function(e){return e.id===id;});
  if(idx>=0) localEvents[idx]=ev; else localEvents.push(ev);
  save(); resetForm();
  if(calendar) calendar.refetchEvents();
  renderMobList();
};
window.deleteEvent=function(){
  var id=document.getElementById('event-id').value;
  if(!id||!confirm('Supprimer ?')) return;
  var raw=getAll().find(function(e){return e.id===id;});
  var toDelete = (raw && !raw._local) ? slugOf(id) : id;
  deletedEvents.push(toDelete);
  localEvents=localEvents.filter(function(e){return e.id!==id;});
  save(); resetForm();
  if(calendar) calendar.refetchEvents();
  renderMobList();
};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
