name: CI

on:
  # Toute PR (quelle que soit sa branche cible) déclenche déjà un run à
  # chaque push sur sa branche. Le push sur main ne sert qu'à revalider
  # après un merge (ou un push direct sans PR) — ce n'est pas un doublon.
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.123.7"
          extended: true

      - name: Build site
        run: hugo --minify --gc
